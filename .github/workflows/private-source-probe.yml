name: OpenFeed private response probe
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [ubuntu-latest, macos-latest]
        default: ubuntu-latest
      mode:
        type: choice
        options: [response, regression]
        default: response
      source_ids:
        type: string
        default: '1c7ede2f7e826f14252ad4414976'
permissions:
  contents: read
  actions: write
concurrency:
  group: openfeed-readonly-response-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ${{ inputs.runner == 'macos-latest' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Enforce existing validation deadline
        id: deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%s)" -ge 1794053385 ]; then
            curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/private-source-probe.yml/disable"
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.deadline.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          repository: kobolibra/openfeed-runtime
          ref: e1054f460fa20002d204704aa8554efa59fddd70
          path: runtime
          ssh-key: ${{ secrets.OPENFEED_RUNTIME_KEY }}
          persist-credentials: false
      - if: steps.deadline.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          repository: kobolibra/openfeed-runtime
          ref: shadow-state
          path: state
          ssh-key: ${{ secrets.OPENFEED_RUNTIME_KEY }}
      - if: steps.deadline.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture bounded response only into a separate private diagnostic ref
        if: steps.deadline.outputs.active == 'true'
        env:
          OPENFEED_MAX_FETCH_BYTES: '8000000'
          PROBE_MODE: ${{ inputs.mode }}
          PROBE_SOURCES: ${{ inputs.source_ids }}
        run: |
          umask 077
          exec > "$RUNNER_TEMP/private-probe.log" 2>&1
          probe_status=0
          if [ "$PROBE_MODE" = regression ]; then
            (cd runtime && python -m pip install -r requirements-lock.txt -r requirements-host-egress.txt && python -m playwright install --with-deps chromium && python -m pytest -q) || probe_status=$?
          else
            python -m pip install -r runtime/requirements-runtime.lock
            python runtime/ops/cloud_probe.py --db state/openfeed.sqlite3 --feed-id "$PROBE_SOURCES" --output "state/diagnostics/$GITHUB_RUN_ID" || probe_status=$?
          fi
          mkdir -p "state/diagnostics/$GITHUB_RUN_ID"
          cp "$RUNNER_TEMP/private-probe.log" "state/diagnostics/$GITHUB_RUN_ID/probe.log"
          cd state
          git config user.name "OpenFeed Readonly Probe"
          git config user.email "openfeed@users.noreply.github.com"
          git add -- "diagnostics/$GITHUB_RUN_ID"
          git commit -m "Private read-only response evidence $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/probe-$GITHUB_RUN_ID"
          exit "$probe_status"
