name: OpenFeed one-off cross-environment comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGETS_B64: ""
    steps:
      - name: Compare public source requests with bounded concurrency
        shell: python
        run: |
          import os,json,base64,subprocess,concurrent.futures,time,threading
          from pathlib import Path
          from urllib.parse import urlsplit,urlencode
          rows=json.loads(base64.b64decode(os.environ['TARGETS_B64']));out=Path('evidence');out.mkdir(exist_ok=True)
          locks={urlsplit(x['url']).hostname:threading.Lock() for x in rows};last={}
          def one(row):
           host=urlsplit(row['url']).hostname
           with locks[host]:
            time.sleep(max(0,8-(time.monotonic()-last.get(host,-100))))
            last[host]=time.monotonic();prefix=out/row['id']
            cmd=['curl','--proto','=https','--proto-redir','=https','--location','--connect-timeout','10','--max-time','30','--max-filesize','5000000','-sS','--dump-header',str(prefix)+'.headers','--output',str(prefix)+'.body','--write-out','%{json}','--user-agent','OpenFeedStudio/0.4 (+private self-hosted RSS creator)','--header','Accept: text/html,application/rss+xml,application/atom+xml,application/xml,text/xml,application/json,application/feed+json;q=0.8,*/*;q=0.3']
            if os.environ.get('PROBE_PROXY'):cmd+=['--proxy',os.environ['PROBE_PROXY']]
            if row['method']=='POST':
             cmd+=['--request','POST']
             if row['json'] is not None:cmd+=['--header','Content-Type: application/json','--data-raw',json.dumps(row['json'])]
             else:cmd+=['--data-raw',urlencode(row['data'])]
            p=subprocess.run(cmd+[row['url']],capture_output=True,text=True)
            try:metrics=json.loads(p.stdout)
            except ValueError:metrics={'raw':p.stdout}
            result={'id':row['id'],'exit':p.returncode,'metrics':metrics,'error':p.stderr[:800]};Path(str(prefix)+'.json').write_text(json.dumps(result))
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(one,rows))
          (out/'results.json').write_text(json.dumps(results,indent=2))
          for x in results:print(x['id'],x['metrics'].get('http_code'),x['exit'])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-environment-evidence
          path: evidence/
          retention-days: 3
