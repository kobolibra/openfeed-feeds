# Finite scheduled build/publication; no sleeping relay, no self-dispatch. Private source/state remain private.
name: OpenFeed scheduled RSS publication
permissions:
  contents: write
  pages: write
concurrency:
  group: openfeed-runtime-state-writer
  cancel-in-progress: false
  queue: max
jobs:
  runtime:
    if: github.repository == 'kobolibra/openfeed-feeds' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.actor == github.repository_owner && inputs.signature == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
    - uses: actions/checkout@v4
      with:
        repository: kobolibra/openfeed-runtime
        ref: e1054f460fa20002d204704aa8554efa59fddd70
        path: runtime
        ssh-key: ${{ secrets.OPENFEED_RUNTIME_KEY }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: kobolibra/openfeed-runtime
        ref: shadow-state
        path: runtime/private-state
        ssh-key: ${{ secrets.OPENFEED_RUNTIME_KEY }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check out static publication repository
      uses: actions/checkout@v4
      with:
        repository: kobolibra/openfeed-feeds
        ref: main
        path: public
        token: ${{ github.token }}
    - name: Run validated bounded production state
      working-directory: runtime
      env:
        RUN_ID: ${{ github.run_id }}
        OPENFEED_PAGES_TOKEN: ${{ github.token }}
      run: |
        umask 077
        exec > "$RUNNER_TEMP/openfeed-private.log" 2>&1
        python - <<'PY'
        import time,json,datetime
        from pathlib import Path
        c=json.loads(Path('private-state/runtime-control.json').read_text())
        assert c['mode']=='production' and c['publish_enabled'] is True
        assert c['mac_writer_stopped'] is True and len(c.get('final_mac_snapshot_sha256',''))==64
        PY
        python -m pip install -r requirements-runtime.lock
        python ops/cloud_tick.py --run-id "$RUN_ID" --public-checkout "$GITHUB_WORKSPACE/public"
'on':
  workflow_dispatch:
    inputs:
      root:
        type: string
        required: false
        default: ''
      generation:
        type: string
        required: false
        default: ''
      not_before:
        type: string
        required: false
        default: ''
      signature:
        type: string
        required: false
        default: ''
      source_ids:
        type: string
        required: false
        default: ''
      restart:
        type: boolean
        default: false
  schedule:
  - cron: 8,18,28,38,48,58 * * * *
